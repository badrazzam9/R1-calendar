<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sign-In</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e; color: #fff; 
            min-height: 100vh; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; padding: 20px; 
        }
        .container { max-width: 400px; width: 100%; text-align: center; }
        h1 { font-size: 1.5rem; margin-bottom: 8px; }
        p { color: #9a9abf; margin-bottom: 20px; }
        
        .btn { 
            display: inline-flex; align-items: center; justify-content: center;
            padding: 16px 28px; border: none; border-radius: 12px; 
            font-size: 1.1rem; font-weight: 600; cursor: pointer; width: 100%;
            margin-bottom: 14px;
        }
        .btn-primary { background: #4285f4; color: #fff; }
        .btn-success { background: #2ed573; color: #fff; }
        
        .token-box { 
            background: #16213e; padding: 16px; border-radius: 12px; 
            margin: 16px 0; 
        }
        .token-box .label { font-size: 0.85rem; color: #9a9abf; margin-bottom: 10px; }
        .token-box textarea { 
            width: 100%; height: 80px; background: #1a1a2e; 
            border: 1px solid #3a3a5c; border-radius: 8px; 
            color: #6c63ff; font-family: monospace; font-size: 0.75rem;
            padding: 10px; resize: none; text-align: center;
        }
        
        .spinner { 
            width: 50px; height: 50px; border: 4px solid #2a2a4a; 
            border-top-color: #6c63ff; border-radius: 50%; 
            animation: spin 0.8s linear infinite; margin: 30px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .success { background: rgba(46,213,115,0.15); color: #2ed573; padding: 16px; border-radius: 10px; margin: 16px 0; font-size: 1.1rem; }
        .error { background: rgba(255,82,82,0.15); color: #ff6b6b; padding: 16px; border-radius: 10px; margin: 16px 0; }
        
        .info-box {
            background: #16213e; padding: 16px; border-radius: 10px; margin: 16px 0; text-align: left;
        }
        .info-box .label { color: #9a9abf; font-size: 0.8rem; margin-bottom: 6px; }
        .info-box .value { color: #6c63ff; font-family: monospace; font-size: 0.75rem; word-break: break-all; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Google Sign-In</h1>
        
        <div id="debug-info" class="info-box" style="display:none;">
            <div class="label">Client ID:</div>
            <div class="value" id="client-id-display"></div>
        </div>
        
        <div id="step1">
            <p>Starting sign-in...</p>
        </div>
        
        <div id="step2" style="display:none;">
            <button class="btn btn-primary" id="btn-signin">🔑 Sign in with Google</button>
        </div>
        
        <div id="step3" style="display:none;">
            <div class="success">✅ Success!</div>
            <div class="token-box">
                <div class="label">Copy this token and enter on R1:</div>
                <textarea id="token-display" readonly></textarea>
            </div>
            <button class="btn btn-success" id="btn-copy">📋 Copy Token</button>
        </div>
        
        <div id="error-box" class="error" style="display:none;"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const clientId = params.get('client_id');
        
        // Show debug info
        if (clientId) {
            document.getElementById('debug-info').style.display = 'block';
            document.getElementById('client-id-display').textContent = clientId;
        }

        function doOAuth() {
            if (!clientId) {
                document.getElementById('step1').style.display = 'none';
                document.getElementById('error-box').textContent = 'Missing client_id in URL!';
                document.getElementById('error-box').style.display = 'block';
                return;
            }
            
            const baseUrl = window.location.origin + window.location.pathname;
            
            const authUrl = 'https://accounts.google.com/o/oauth2/v2/auth?' +
                'client_id=' + encodeURIComponent(clientId) +
                '&redirect_uri=' + encodeURIComponent(baseUrl) +
                '&response_type=token' +
                '&scope=' + encodeURIComponent('https://www.googleapis.com/auth/calendar.readonly') +
                '&include_granted_scopes=true';

            console.log('Redirecting to:', authUrl);
            
            // Try redirect
            window.location.replace(authUrl);
        }

        // Check for OAuth callback first
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            const urlParams = new URLSearchParams(hash);
            const token = urlParams.get('access_token');
            const error = urlParams.get('error');

            document.getElementById('step1').style.display = 'none';

            if (error) {
                document.getElementById('error-box').textContent = 'Error: ' + error;
                document.getElementById('error-box').style.display = 'block';
                return;
            }

            if (token) {
                document.getElementById('step3').style.display = 'block';
                document.getElementById('token-display').value = token;
            } else {
                document.getElementById('error-box').textContent = 'No token received. Try again.';
                document.getElementById('error-box').style.display = 'block';
            }
        } else if (!clientId) {
            document.getElementById('step1').style.display = 'none';
            document.getElementById('error-box').textContent = 'Missing client_id! Open the link from your R1.';
            document.getElementById('error-box').style.display = 'block';
        } else {
            // Try immediate redirect
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
            
            document.getElementById('btn-signin').addEventListener('click', doOAuth);
            
            // Try after short delay
            setTimeout(doOAuth, 500);
        }

        document.getElementById('btn-copy').addEventListener('click', () => {
            const token = document.getElementById('token-display').value;
            navigator.clipboard.writeText(token).then(() => {
                document.getElementById('btn-copy').textContent = '✅ Copied!';
                setTimeout(() => {
                    document.getElementById('btn-copy').textContent = '📋 Copy Token';
                }, 2000);
            });
        });
    </script>
</body>
</html>
