<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sign-In Complete</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e; color: #fff; 
            min-height: 100vh; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; padding: 20px; 
            text-align: center;
        }
        .container { max-width: 400px; width: 100%; }
        h1 { font-size: 1.5rem; margin-bottom: 8px; }
        p { color: #9a9abf; margin-bottom: 20px; }
        
        .spinner { 
            width: 50px; height: 50px; border: 4px solid #2a2a4a; 
            border-top-color: #6c63ff; border-radius: 50%; 
            animation: spin 0.8s linear infinite; margin: 30px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .success { 
            background: #16213e; border: 2px solid #2ed573; 
            border-radius: 16px; padding: 24px; margin: 20px 0; 
        }
        .success h2 { color: #2ed573; font-size: 1.3rem; margin-bottom: 16px; }
        
        .qr-box { background: #fff; padding: 16px; border-radius: 12px; margin: 16px 0; }
        .qr-box img { width: 200px; height: 200px; }
        
        .error { 
            background: rgba(255,82,82,0.15); color: #ff6b6b; 
            padding: 16px; border-radius: 10px; margin: 20px 0; 
        }
        
        .btn { 
            display: inline-flex; align-items: center; justify-content: center;
            padding: 14px 24px; border: none; border-radius: 10px; 
            font-size: 1rem; font-weight: 600; cursor: pointer; 
            background: #6c63ff; color: #fff; margin-top: 16px;
        }
        
        .info { background: #16213e; padding: 16px; border-radius: 10px; margin: 16px 0; text-align: left; }
        .info .label { color: #9a9abf; font-size: 0.8rem; }
        .info .value { color: #6c63ff; font-family: monospace; font-size: 0.75rem; word-break: break-all; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Google Sign-In</h1>
        
        <div id="loading">
            <div class="spinner"></div>
            <p>Processing sign-in...</p>
        </div>
        
        <div id="error" style="display:none;" class="error"></div>
        
        <div id="success" style="display:none;" class="success">
            <h2>✅ Sign-In Complete!</h2>
            <p style="margin-bottom: 16px;">Show this QR to your R1 to sign in:</p>
            
            <div class="qr-box">
                <img id="token-qr" src="">
            </div>
            
            <p style="font-size: 0.85rem;">R1 will scan this automatically!</p>
        </div>
        
        <div id="debug" style="display:none;" class="info">
            <div class="label">Code received:</div>
            <div class="value" id="auth-code"></div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const error = params.get('error');
        const clientId = localStorage.getItem('oauth_client_id');
        const clientSecret = localStorage.getItem('oauth_client_secret');

        document.getElementById('loading').style.display = 'none';

        if (error) {
            document.getElementById('error').textContent = 'Error: ' + error;
            document.getElementById('error').style.display = 'block';
        } else if (code) {
            // Show code for debugging
            document.getElementById('auth-code').textContent = code;
            document.getElementById('debug').style.display = 'block';
            
            // Exchange code for tokens
            exchangeCodeForTokens(code);
        } else {
            document.getElementById('error').textContent = 'No authorization code received';
            document.getElementById('error').style.display = 'block';
        }

        async function exchangeCodeForTokens(authCode) {
            if (!clientId || !clientSecret) {
                document.getElementById('error').textContent = 'Missing client credentials. Open the app on R1 first.';
                document.getElementById('error').style.display = 'block';
                return;
            }

            try {
                const resp = await fetch('https://oauth2.googleapis.com/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        client_id: clientId,
                        client_secret: clientSecret,
                        code: authCode,
                        grant_type: 'authorization_code',
                        redirect_uri: window.location.origin + window.location.pathname
                    })
                });

                const data = await resp.json();

                if (data.error) {
                    document.getElementById('error').textContent = 'Error: ' + (data.error_description || data.error);
                    document.getElementById('error').style.display = 'block';
                    return;
                }

                // Success! Show token as QR
                const tokenData = JSON.stringify({
                    access_token: data.access_token,
                    refresh_token: data.refresh_token || ''
                });

                QRCode.toDataURL(tokenData, { width: 200, margin: 2 }, (err, url) => {
                    if (err) {
                        document.getElementById('error').textContent = 'Error generating QR: ' + err.message;
                        document.getElementById('error').style.display = 'block';
                        return;
                    }
                    document.getElementById('token-qr').src = url;
                    document.getElementById('success').style.display = 'block';
                });

            } catch (err) {
                document.getElementById('error').textContent = 'Error: ' + err.message;
                document.getElementById('error').style.display = 'block';
            }
        }
    </script>
</body>
</html>
